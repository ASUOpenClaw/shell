services:
    # ── Redis — session store + rate limiter ────────────────────────────────────
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    # ── NATS — conversation history stream ──────────────────────────────────────
    nats:
        image: nats:2.10-alpine
        restart: unless-stopped
        command: ["-js", "-m", "8222"]
        ports:
            - "4222:4222" # client
            - "8222:8222" # HTTP monitoring  →  http://localhost:8222
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:8222/healthz",
                ]
            interval: 5s
            timeout: 3s
            retries: 5

