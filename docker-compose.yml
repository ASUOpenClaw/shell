services:
    shell:
        image: shell:dev
        container_name: shell-shell-1
        restart: unless-stopped
        ports:
            - "${SHELL_SERVER_PORT:-18080}:${SHELL_SERVER_PORT:-18080}"
        env_file: .env
        environment:
            SHELL_SERVER_HOST: "0.0.0.0"
            SHELL_GOCLAW_GATEWAY_URL: "http://goclaw:18790"
            SHELL_REDIS_URL: "redis://rest-redis-1:6379"
            SHELL_NATS_URL: "nats://rest-nats-1:4222"
            SHELL_REST_API_URL: "http://rest-api-1:8000"
            SHELL_REQUEST_TIMEOUT_MS: "300000"
        networks:
            - openclaw-net

networks:
    openclaw-net:
        external: true
